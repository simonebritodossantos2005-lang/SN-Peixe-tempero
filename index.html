<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd21a">
<title>SN Peixe & Temperos</title>
<style>
:root{--yellow:#ffd21a;--yellow2:#fff3aa;--pink:#ef4f91;--pink2:#ffd7e8;--ink:#172a42;--green:#25b85b;--cream:#fff9d9}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#fff9d9;color:var(--ink)}
body{overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh}

/* ===================== SOCIAL FEED ===================== */
#socialPage{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;background:#090909}
.social-top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(760px,100%);z-index:50;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:linear-gradient(#000a,transparent);pointer-events:none}
.social-top>*{pointer-events:auto}
.social-title{font-size:21px;font-weight:900;text-shadow:0 2px 8px #000}
.social-menu{width:46px;height:46px;border:0;border-radius:16px;background:#fff;color:var(--pink);font-size:27px;box-shadow:0 4px 16px #0005}
.feed-card{position:relative;height:100vh;min-height:560px;scroll-snap-align:start;background:#111;overflow:hidden}
.feed-media{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.feed-gradient{position:absolute;inset:0;background:linear-gradient(transparent 43%,#000d 100%);pointer-events:none}
.feed-caption{position:absolute;left:17px;right:92px;bottom:70px;color:#fff;text-shadow:0 2px 8px #000;font-size:16px;line-height:1.42;z-index:4}
.feed-caption b{display:block;font-size:21px;margin-bottom:6px}
.feed-actions{position:absolute;right:12px;bottom:72px;display:flex;flex-direction:column;gap:12px;z-index:5}
.feed-action{width:51px;height:51px;border:0;border-radius:50%;background:#fff;color:#222;box-shadow:0 4px 15px #0006;font-size:22px}
.feed-action.liked{color:var(--pink)}
.feed-action small{display:block;font-size:8px;font-weight:900}
.feed-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:60px;text-shadow:0 3px 18px #000;opacity:0;pointer-events:none}
.feed-card.paused .feed-play{opacity:1}
.feed-hint{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);color:#fff;font-size:11px;opacity:.85;z-index:4}
.feed-empty{height:100vh;display:grid;place-items:center;color:#fff;text-align:center;padding:30px;font-size:20px}

/* ===================== STORE ===================== */
#store{display:none;min-height:100vh;background:linear-gradient(180deg,#fff9d9,#fff)}
#store.active{display:block}
.store-header{position:sticky;top:0;z-index:30;background:#fff9d9ee;backdrop-filter:blur(10px);border-bottom:2px solid #fff;padding:9px 12px;display:flex;align-items:center;gap:10px}
.menu-btn{width:47px;height:47px;border:0;border-radius:15px;background:#fff;color:var(--pink);font-size:27px;box-shadow:0 4px 15px #0002}
.store-brand{font-size:19px;font-weight:900}
.store-body{padding:14px 13px 100px}
.category-menu{display:flex;gap:8px;overflow-x:auto;padding:2px 0 13px;scrollbar-width:none}
.category-menu::-webkit-scrollbar{display:none}
.category-pill{white-space:nowrap;border:2px solid #f3b5cf;background:#fff;border-radius:20px;padding:8px 12px;color:#8b1d54;font-weight:900}
.category-pill.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.category-block{margin:8px 0 25px;scroll-margin-top:82px}
.category-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.category-heading h2{margin:0;color:#8b1d54;font-size:24px}
.category-heading span{font-size:12px;color:#777}
.prodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.prod{background:#fff;border:3px solid #f7c4da;border-radius:21px;padding:9px;box-shadow:0 7px 18px #7b214022}
.prod img{width:100%;height:140px;object-fit:cover;border-radius:14px;display:block}
.prod-placeholder{height:140px;display:grid;place-items:center;background:#fff1f7;border-radius:14px;color:#a65a7c;font-weight:800}
.prod h3{font-size:16px;margin:8px 2px 4px;color:#731643}
.price{font-size:18px;font-weight:900;color:#1b7d46}
.desc{font-size:12px;color:#666;min-height:29px;margin:4px 2px}
.add{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;padding:10px;font-weight:900}
.empty{background:#fff;border-radius:19px;padding:24px;text-align:center;color:#555}

/* ===================== CART ===================== */
.cart-panel{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);transition:.3s;width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:3px solid #f4bfd6;border-radius:28px 28px 0 0;box-shadow:0 -12px 35px #0005;z-index:100;padding:16px}
.cart-panel.open{transform:translate(-50%,0)}
.cart-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:#222;color:#fff;border-radius:50%;width:38px;height:38px}
.cart-row{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;background:#fff8fb;border-radius:15px;padding:8px;margin:8px 0}
.cart-row img{width:58px;height:53px;object-fit:cover;border-radius:11px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{border:0;border-radius:50%;width:28px;height:28px;background:#ffe2ef}
.customer-fields,.delivery{background:#fff8fb;border-radius:16px;padding:11px;margin-top:10px}
.customer-fields input{display:block;width:100%;padding:10px;margin-top:7px;border:1px solid #dfc4d2;border-radius:10px}
.delivery{background:#fff9d9}.delivery label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:12px 0}
.wa{width:100%;border:0;background:#25b85b;color:#fff;border-radius:18px;padding:15px;font-weight:900}

/* ===================== ORDERS ===================== */
#ordersArea{display:none;padding:18px 13px 100px;background:#fff9d9;min-height:100vh}
#ordersArea.active{display:block}
.back{border:0;background:var(--pink);color:#fff;border-radius:15px;padding:10px 13px;font-weight:900}
.order-phone{background:#fff;border-radius:16px;padding:12px}
.order-phone input{width:100%;padding:11px;border:2px solid #ecc6d7;border-radius:10px;margin-top:7px}
.order-card{background:#fff;border:2px solid #f3c5d9;border-radius:19px;padding:14px;margin:12px 0}
.order-head{display:flex;justify-content:space-between;gap:8px}
.order-status{background:#ffe070;border-radius:16px;padding:6px 9px;font-size:12px;font-weight:900}

/* ===================== BOTTOM NAV ===================== */
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);z-index:40;display:flex;justify-content:space-around;background:#ffd21ae8;backdrop-filter:blur(10px);border-top:2px solid #fff;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.bottom button{background:none;border:0;color:#172a42;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom .ico{font-size:22px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);transition:.3s;background:#172a42;color:#fff;padding:12px 17px;border-radius:20px;z-index:200;font-weight:900}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.prod img,.prod-placeholder{height:120px}}
</style>
</head>
<body>
<div class="app">

<section id="socialPage">
  <div class="social-top">
    <div class="social-title" id="socialTitle">SN Peixe & Temperos</div>
    <button class="social-menu" onclick="openStore()">☰</button>
  </div>
  <div id="feed"></div>
</section>

<section id="store">
  <header class="store-header">
    <button class="menu-btn" onclick="backSocial()">☰</button>
    <div class="store-brand" id="storeTitle">SN Peixe & Temperos</div>
    <button class="menu-btn" style="margin-left:auto" onclick="openCart()">🛒 <span id="badge">0</span></button>
  </header>
  <div class="store-body">
    <div id="categoryMenu" class="category-menu"></div>
    <div id="categoriesArea"></div>
  </div>
</section>

<section id="ordersArea">
  <button class="back" onclick="openStore()">← Voltar</button>
  <h2>📦 Meus pedidos</h2>
  <p>Acompanhe o andamento do seu pedido.</p>
  <div class="order-phone">
    <b>📱 Seu WhatsApp</b>
    <input id="ordersPhone" inputmode="tel" placeholder="Digite o WhatsApp usado no pedido">
    <button class="back" style="margin-top:8px" onclick="loadMyOrders()">🔄 Atualizar</button>
  </div>
  <div id="ordersList"><div class="empty">Digite seu WhatsApp para consultar seus pedidos. 💗</div></div>
</section>

<div id="cartPanel" class="cart-panel">
  <div class="cart-head"><h2>🛒 Carrinho</h2><button class="close" onclick="closeCart()">✕</button></div>
  <div id="cartItems"></div>
  <div class="customer-fields">
    <b>👤 Seus dados</b>
    <input id="customerName" placeholder="Seu nome">
    <input id="customerPhone" placeholder="Seu WhatsApp" inputmode="tel">
    <input id="customerAddress" placeholder="Endereço para entrega">
  </div>
  <div class="delivery">
    <b>🚚 Entrega</b>
    <label><span><input type="radio" name="delivery" value="entrega" checked onchange="renderCart()"> Entregar em casa</span><span id="deliveryPrice">Taxa: R$ 0,00</span></label>
    <label><span><input type="radio" name="delivery" value="feira" onchange="renderCart()"> Retirar na feira</span><span>Sem taxa</span></label>
  </div>
  <div class="total"><span>Total</span><span id="cartTotal">R$ 0,00</span></div>
  <button class="wa" onclick="sendWhatsApp()">🟢 Finalizar pedido via WhatsApp</button>
</div>

<nav class="bottom">
  <button onclick="backSocial()"><span class="ico">🎬</span>Social</button>
  <button onclick="openStore()"><span class="ico">🛍️</span>Produtos</button>
  <button onclick="showMyOrders()"><span class="ico">📦</span>Pedidos</button>
  <button onclick="openCart()"><span class="ico">🛒</span>Carrinho</button>
</nav>
<div id="toast" class="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://axymhlvjjnxtwbbytcqz.supabase.co";
const SB_KEY="sb_publishable_-sCv8TRqFN1nCyzgK0yzOw_K4AB8Rpa";
const sb=supabase.createClient(SB_URL,SB_KEY);
let products=[],cfg={},posts=[],cart=[];
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}

async function init(){
 const [pr,cr,po]=await Promise.all([
  sb.from("produtos").select("*").eq("disponivel",true).order("id"),
  sb.from("configuracoes").select("*").eq("id",1).maybeSingle(),
  sb.from("postagens").select("*").eq("publicado",true).order("criado_em",{ascending:false})
 ]);
 products=pr.data||[];cfg=cr.data||{};posts=po.data||[];
 const title=cfg.nome_empresa||"SN Peixe & Temperos";
 $("socialTitle").textContent=title;$("storeTitle").textContent=title;
 renderSocial();renderStore();
}

function renderSocial(){
 const box=$("feed");
 if(!posts.length){box.innerHTML='<div class="feed-empty">Ainda não há publicações.<br>Volte sempre! 💗</div>';return}
 box.innerHTML=posts.map((p,i)=>{
  const isVideo=p.tipo==="video";
  return `<article class="feed-card">
   ${isVideo?`<video class="feed-media" playsinline preload="metadata" src="${esc(p.midia_url)}" onclick="toggleVideo(this)"></video>`:`<img class="feed-media" src="${esc(p.midia_url)}" alt="Publicação SN" loading="${i<2?"eager":"lazy"}">`}
   <div class="feed-gradient"></div><div class="feed-play">▶</div>
   <div class="feed-caption"><b>SN Peixe & Temperos</b>${esc(p.legenda||"")}</div>
   <div class="feed-actions">
    <button class="feed-action" onclick="likePost(${p.id},this)">❤️<small>Curtir</small></button>
    ${p.permitir_comentarios?`<button class="feed-action" onclick="commentPost(${p.id})">💬<small>Comentar</small></button>`:""}
    <button class="feed-action" onclick="sharePost(${p.id})">↗️<small>Compartilhar</small></button>
    <button class="feed-action" onclick="openStore()">🛍️<small>Comprar</small></button>
   </div>
   ${i===0?'<div class="feed-hint">↕ Role para ver mais</div>':""}
  </article>`;
 }).join("");

 const obs=new IntersectionObserver(entries=>entries.forEach(e=>{
   const v=e.target.querySelector("video");
   if(e.isIntersecting&&e.intersectionRatio>.65){if(v){v.currentTime=0;v.play().catch(()=>{})}}
   else if(v)v.pause();
 }),{threshold:[.65]});
 document.querySelectorAll(".feed-card").forEach(card=>obs.observe(card));
 document.querySelectorAll(".feed-card video").forEach(v=>v.addEventListener("ended",()=>{
   const n=v.closest(".feed-card").nextElementSibling;if(n)n.scrollIntoView({behavior:"smooth",block:"start"});
 }));
}

function toggleVideo(v){if(v.paused){v.play();v.parentElement.classList.remove("paused")}else{v.pause();v.parentElement.classList.add("paused")}}
async function likePost(id,b){
 const key="sn_like_"+id;if(localStorage.getItem(key)){toast("Você já curtiu 💗");return}
 const r=await sb.from("curtidas_postagem").insert({postagem_id:id});
 if(!r.error){localStorage.setItem(key,"1");b.classList.add("liked");toast("Curtido! 💗")}else toast("Não foi possível curtir agora.");
}
async function commentPost(id){
 const txt=prompt("Escreva seu comentário:");if(!txt?.trim())return;
 const name=prompt("Como podemos chamar você?","Cliente");if(!name)return;
 const r=await sb.from("comentarios_postagem").insert({postagem_id:id,nome:name,comentario:txt.trim()});
 toast(r.error?"Não foi possível enviar o comentário.":"Comentário enviado! 💗");
}
async function sharePost(id){
 const p=posts.find(x=>x.id===id),text=`SN Peixe & Temperos 💗\n${p?.legenda||"Confira esta publicação!"}`;
 if(navigator.share){try{await navigator.share({title:"SN Peixe & Temperos",text,url:location.href});return}catch(e){}}
 location.href="https://wa.me/?text="+encodeURIComponent(text+"\n"+location.href);
}

function getCategories(){
 const map=new Map();
 products.forEach(p=>{const k=String(p.categoria||"Outros");if(!map.has(k))map.set(k,[]);map.get(k).push(p)});
 return [...map.entries()];
}
function labelCat(c){return String(c||"Outros").replaceAll("_"," ").replace(/\b\w/g,m=>m.toUpperCase())}
function renderStore(){
 const cats=getCategories();
 $("categoryMenu").innerHTML=cats.map(([c])=>`<button class="category-pill" onclick="showOnlyCategory('${esc(c)}')">${esc(labelCat(c))}</button>`).join("");
 $("categoriesArea").innerHTML=cats.map(([c,a])=>`
  <section class="category-block" id="cat-${encodeURIComponent(c)}">
   <div class="category-heading"><h2>${esc(labelCat(c))}</h2><span>${a.length} produto${a.length===1?"":"s"}</span></div>
   <div class="prodgrid">${a.map(p=>`
    <article class="prod">
     ${p.imagem_url?`<img src="${esc(p.imagem_url)}" loading="lazy">`:`<div class="prod-placeholder">Sem foto</div>`}
     <h3>${esc(p.nome)}</h3><div class="price">${money(p.preco)} / ${esc(p.unidade||"kg")}</div>
     <div class="desc">${esc(p.descricao||"")}</div><button class="add" onclick="add(${p.id})">🛒 Adicionar ao carrinho</button>
    </article>`).join("")}</div>
  </section>`).join("");
}
function showOnlyCategory(c){
 document.querySelectorAll(".category-block").forEach(x=>x.style.display="none");
 const el=$("cat-"+encodeURIComponent(c));if(el){el.style.display="block";el.scrollIntoView({behavior:"smooth",block:"start"})}
 document.querySelectorAll(".category-pill").forEach(b=>b.classList.toggle("active",b.textContent.trim()===labelCat(c)));
}
function openStore(){$("socialPage").style.display="none";$("ordersArea").classList.remove("active");$("store").classList.add("active");window.scrollTo({top:0,behavior:"smooth"})}
function backSocial(){$("store").classList.remove("active");$("ordersArea").classList.remove("active");$("socialPage").style.display="block";window.scrollTo({top:0,behavior:"smooth"})}

function add(id){const p=products.find(x=>x.id===id);if(!p)return;const i=cart.find(x=>x.id===id);if(i)i.qty++;else cart.push({...p,qty:1});updateBadge();renderCart();toast(p.nome+" adicionado! 🛒")}
function updateBadge(){$("badge").textContent=cart.reduce((s,p)=>s+p.qty,0)}
function openCart(){renderCart();$("cartPanel").classList.add("open")}
function closeCart(){$("cartPanel").classList.remove("open")}
function renderCart(){
 const box=$("cartItems");
 if(!cart.length){box.innerHTML="<div class='empty'>Seu carrinho está vazio. 🛒💗</div>";$("cartTotal").textContent=money(0);return}
 box.innerHTML=cart.map((p,i)=>`<div class="cart-row">${p.imagem_url?`<img src="${esc(p.imagem_url)}">`:"<div>Sem foto</div>"}<div><b>${esc(p.nome)}</b><br><small>${money(p.preco)} / ${esc(p.unidade||"kg")}</small></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${p.qty}</b><button onclick="changeQty(${i},1)">+</button><button onclick="cart.splice(${i},1);updateBadge();renderCart()">🗑️</button></div></div>`).join("");
 const delivery=document.querySelector('input[name="delivery"]:checked')?.value||"entrega";
 const sub=cart.reduce((s,p)=>s+Number(p.preco||0)*p.qty,0),fee=delivery==="entrega"&&cfg.entrega_ativa?Number(cfg.taxa_entrega||0):0;
 $("deliveryPrice").textContent=delivery==="entrega"?"Taxa: "+money(fee):"Sem taxa";$("cartTotal").textContent=money(sub+fee);
}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateBadge();renderCart()}

async function sendWhatsApp(){
 if(!cart.length){toast("Adicione um produto primeiro.");return}
 const name=$("customerName").value.trim()||"Cliente",phone=$("customerPhone").value.trim(),address=$("customerAddress").value.trim();
 const delivery=document.querySelector('input[name="delivery"]:checked')?.value||"entrega";
 if(delivery==="entrega"&&!address){toast("Informe o endereço para entrega.");$("customerAddress").focus();return}
 const sub=cart.reduce((s,p)=>s+Number(p.preco||0)*p.qty,0),fee=delivery==="entrega"&&cfg.entrega_ativa?Number(cfg.taxa_entrega||0):0,total=sub+fee;
 const rows=cart.map(p=>({cliente:name,telefone:phone,produto:p.nome,quantidade:Number(p.qty||1),cor:"",valor:Number(p.preco||0)*Number(p.qty||1),status:"novo",observacao:delivery==="entrega"?`Entrega em casa | Endereço: ${address} | Taxa: ${money(fee)} | Total: ${money(total)}`:`Retirada na feira | Total: ${money(total)}`}));
 const r=await sb.from("pedidos").insert(rows).select("id");if(r.error){toast("Não foi possível registrar o pedido.");return}
 localStorage.setItem("sn_customer_phone",phone);
 const lines=cart.map(p=>`- ${p.nome} x${p.qty} — ${money(Number(p.preco||0)*p.qty)}`).join("\n");
 let t=`Olá, Silvani! 💗 Quero fazer este pedido:\n\nPedido #${r.data?.[0]?.id||""}\nCliente: ${name}`;
 if(phone)t+=`\nWhatsApp: ${phone}`;t+=`\n\n${lines}\n\nSubtotal: ${money(sub)}`;
 t+=delivery==="entrega"?`\nEntrega: em casa\nEndereço: ${address}\nTaxa: ${money(fee)}`:"\nRetirada: na feira";t+=`\nTotal: ${money(total)}`;
 const number=String(cfg.whatsapp||"").replace(/\D/g,"");if(!number){toast("Pedido registrado, mas o WhatsApp não está configurado.");return}
 location.href="https://wa.me/"+number+"?text="+encodeURIComponent(t);
}

function showMyOrders(){
 $("socialPage").style.display="none";$("store").classList.remove("active");$("ordersArea").classList.add("active");
 const saved=localStorage.getItem("sn_customer_phone")||"";$("ordersPhone").value=saved;if(saved)loadMyOrders();
}
async function loadMyOrders(){
 const phone=$("ordersPhone").value.trim(),box=$("ordersList");if(!phone){box.innerHTML='<div class="empty">Digite o WhatsApp usado no pedido.</div>';return}
 const clean=phone.replace(/\D/g,"");localStorage.setItem("sn_customer_phone",phone);
 let r=await sb.from("pedidos").select("id,cliente,telefone,produto,quantidade,valor,status,observacao,criado_em").eq("telefone",phone).order("id",{ascending:false}),rows=r.data||[];
 if(!rows.length&&clean!==phone){const r2=await sb.from("pedidos").select("id,cliente,telefone,produto,quantidade,valor,status,observacao,criado_em").eq("telefone",clean).order("id",{ascending:false});rows=r2.data||[]}
 if(!rows.length){box.innerHTML='<div class="empty">Nenhum pedido encontrado. 💗</div>';return}
 box.innerHTML=rows.map(o=>`<article class="order-card"><div class="order-head"><b>📦 Pedido #${o.id}</b><span class="order-status">${esc(o.status||"novo")}</span></div><div style="margin-top:9px"><b>${esc(o.produto||"Produto")}</b> × ${Number(o.quantidade||1)}<br>${money(o.valor)}</div><div style="margin-top:8px;font-size:12px;color:#666">${esc(o.observacao||"")}</div></article>`).join("");
}
init();
</script>
</body>
</html>
